<style>

  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--text); background:radial-gradient(circle at top left, rgba(35,231,255,0.14), transparent 34%), var(--bg); }
  main { max-width:640px; padding:2rem; text-align:center; }
  .eyebrow { color:var(--lime, #b8ff42); text-transform:uppercase; letter-spacing:0.18em; font-size:0.78rem; font-weight:800; }
  h1 { font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-0.05em; margin:0.75rem 0; }
  p { color:var(--muted); line-height:1.6; }
  .button { display:inline-block; margin-top:1.25rem; padding:0.95rem 1.4rem; border-radius:999px; background:linear-gradient(135deg, var(--cyan), #ff2b4f); color:#061017; font-weight:800; text-decoration:none; }
