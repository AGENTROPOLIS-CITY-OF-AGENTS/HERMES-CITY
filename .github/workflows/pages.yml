name: Build and deploy HERMES CITY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build (which also runs on pull requests) only reads.
# Pages/OIDC write scopes are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Static-site verification (routes, links, a11y, contrast, canonical host, CSP)
        run: python3 scripts/verify-site.py

      - name: Pages allowlist gate unit tests
        run: python3 -m unittest -v tests/test_pages_artifact.py

      - name: Build Visual Compute
        run: npm run build

      - name: Validate AGENTROPOLIS design-system contract
        run: |
          set -euo pipefail
          grep -q 'data-design-system="agentropolis-0.2.0"' index.html
          grep -q 'GLOBE → HERMES CITY → DISTRICT / SUB-DISTRICT → APPLICATION → AGENT / ACTION' index.html
          grep -q 'IDENTITY' index.html
          grep -q 'RECEIPT' index.html
          grep -q -- '--cyan:#19E6E6' styles.css
          grep -q -- '--red:#FF2A2A' styles.css
          grep -q -- '--obsidian:#05070A' styles.css
          grep -q 'prefers-reduced-motion' styles.css
          for tier in full adaptive lite minimum; do
            grep -q "data-tier=\"$tier\" .*aria-pressed=" index.html
          done
          grep -q 'id="globe-fallback"' index.html

      # Explicit allowlist (scripts/pages-allowlist.json). Nothing else is copied.
      - name: Assemble public-safe site from allowlist
        run: python3 scripts/pages_artifact.py assemble --out _site

      - name: Verify Pages artifact (fail on any non-allowlisted / protected path or credential pattern)
        run: python3 scripts/pages_artifact.py verify --site _site --inventory pages-artifact-inventory.json

      - name: Upload artifact inventory (audit evidence)
        uses: actions/upload-artifact@v4
        with:
          name: pages-artifact-inventory
          path: pages-artifact-inventory.json
          if-no-files-found: error

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
