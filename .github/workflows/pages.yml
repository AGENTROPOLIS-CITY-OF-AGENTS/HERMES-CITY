name: Build and deploy HERMES CITY

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install visual dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Visual Compute
        run: npm run build

      - name: Assemble allowlisted Pages artifact
        run: python3 scripts/pages_artifact.py assemble --out _site

      - name: Fail if artifact contains a non-allowlisted or denylisted path
        run: python3 scripts/pages_artifact.py verify --site _site

      - name: Pages artifact denylist tests
        run: python3 -m unittest -v tests/test_pages_artifact.py

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
