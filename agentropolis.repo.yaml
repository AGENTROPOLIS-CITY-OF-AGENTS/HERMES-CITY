schema_version: 1.0.0
repo_id: hermes-city
display_name: Hermes City
system_role: public-coordination-and-mini-city-surface
district: null
canonical:
  provider: github
  repository: wiredchaos/HERMES-CITY
  default_branch: main
  release_source: true
  direct_main_push: false
gitlawb:
  role: agent-coding-workspace
  node_env: GITLAWB_NODE
  workspace_status: unlinked
  repository: null
  owner_did: null
  promotion_mode: validated-branch-to-github-pr
  branch_prefix: gitlawb/
hermes:
  orchestrator: mission-control
  router_skill: repo-federation-router
  allowed_actions: [inspect, create-branch, run-validation, open-pull-request, publish-public-safe-docs]
  forbidden_actions: [direct-main-push, expose-private-runtime, self-approve, deploy-production-without-approval, expose-secrets]
commands:
  install: null
  lint: null
  test: null
  typecheck: null
  build: null
  dry_deploy: null
security:
  preflight: wiredchaos/AGENTROPOLIS-54T
  capability_membrane: wiredchaos/AGENTROPOLIS-AGENT-MCP
  human_approval_required: true
  secret_policy: never-in-prompts-logs-or-receipts
deployment:
  control_plane: wiredchaos/AGENTROPOLIS-DEPLOY
  provider: cloudflare
  target: public-safe-pages-or-worker
  status: planned
  working_directory: null
  health_endpoint: /health
  readiness_endpoint: /ready
  staging_required: true
  production_approval_required: true
dependencies: [wiredchaos/agentropolis, wiredchaos/AGENTROPOLIS-54T, wiredchaos/AGENTROPOLIS-AGENT-MCP, wiredchaos/AGENTROPOLIS-DEPLOY]
receipts:
  build: required
  test: required
  security: required
  deployment: required
  rollback: required
